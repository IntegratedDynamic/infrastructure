# Dex (shared OIDC provider) -- extracted from gitops repo's
# bootstrap/values.yaml (infra#84 follow-up). dex-secret itself lives in
# secrets-apps' wave 2 now (values-secrets.yaml; argocd.tf's
# helm_release.dex_apps depends_on helm_release.secrets_apps) -- this
# domain just consumes the Secret it materializes.
#
# dex-gateway's HTTPRoute moved OUT to networking-resources-apps' wave 1
# (values-networking-resources.yaml -- was the separate `gateways-apps`
# domain, merged in 2026-08-27) -- Dex itself (this chart) has no
# Gateway API dependency at all, it's a plain Deployment/Service that
# argo-workflows dials in-cluster (http://dex.gateway.svc:5556, see
# values-argo-workflows.yaml), never through the public route. Bundling
# dex-gateway in here used to force this WHOLE domain's health (ArgoCD's
# recursive Application health check aggregates both nested Applications)
# to wait on networking-apps' Gateway API CRDs even though the product
# itself never needed them -- confirmed live (2026-08-25 investigation):
# dex itself converges in about a minute once its Application exists, but
# wait_networking_healthy alone routinely takes 5-6 minutes, all of it dead
# time for this domain. See platform-apps/README.md's "Decoupling gateway
# routes from wait_networking_healthy" section.
#
# Kept as its OWN domain rather than bundled with argocd-config/grafana
# (which share the identical secrets-apps-only dependency profile):
# argo-workflows-apps' own wait-gate needs to check specifically "is Dex
# ready", not a bundle diluted by unrelated apps' health.
apps:
  - {name: dex, namespace: gateway, chartPath: services/platform/dex/chart, valueFile: values-scaleway.yaml, wave: "0", syncWaveLabelPaths: ['dex.podLabels.scalepack\.fr/sync-wave']}
