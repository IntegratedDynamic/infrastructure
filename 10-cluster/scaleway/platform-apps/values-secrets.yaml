# OpenBao + ESO + secrets-sync + every platform ExternalSecret, in ONE
# parent Application ordered by ArgoCD's own intra-Application sync-waves --
# merged 2026-08-27 from what used to be three separate top-level
# Applications (standalone-apps + secrets-apps + eso-data-apps), each
# needing its own Terraform-level `wait-argocd-apps-healthy` polling Job
# between them. Those two cross-Application hops (wait_standalone_healthy,
# wait_secrets_healthy-before-eso-data) are now free intra-Application wave
# boundaries -- proven live 2026-08-27 for `external-secrets` wave 0 ->
# `secrets-sync` wave 1, extended here to the OpenBao and ESO-data hops
# that share the exact same "a later wave only needs what an earlier wave
# of THIS Application already made Healthy" shape.
#
# Only ONE Terraform gate survives for this whole tree: argocd.tf's
# module.wait_secrets_healthy, which watches this single `secrets-apps`
# Application and now transitively covers OpenBao readiness, ESO's CRDs
# being Established, ESO's webhook serving, and every product's
# ExternalSecret having synced -- everything downstream that used to gate
# on wait_standalone_healthy / eso_data_apps now gates on this one check.
#
# openbao-init's own restore credentials (scaleway-s3-credentials) and
# openbao's KMS auto-unseal credentials (openbao-unseal-aws) are
# Terraform-managed directly in this repo's main.tf -- argocd.tf's
# helm_release.secrets_apps depends_on those two kubernetes_secret
# resources (so ArgoCD's openbao Application can't be mid-retry writing
# into the openbao namespace while Terraform independently deletes it on
# destroy -- confirmed live 2026-08-25 when openbao lived in the old
# standalone-apps).
#
# secrets-sync's own ClusterSecretStore/PushSecret are the ONE deliberate
# exception to "every ExternalSecret-like resource lives in the uniform
# wave-2 data tier": they're what every OTHER ExternalSecret resolves
# against, so they sit in wave 1 alongside external-secrets itself, not the
# data wave downstream of it -- a chicken-and-egg exception, not a
# case-by-case judgment call. See platform-apps/README.md.
apps:
  # ── wave 0: needs nothing but ArgoCD ───────────────────────────────────
  # openbao + openbao-init share a wave for the chicken-and-egg reason
  # gitops repo's bootstrap/README.md documents: openbao's own Application
  # health never goes Healthy until openbao-init's restore Job has
  # succeeded, so a later wave for openbao-init could never even start.
  # Neither needs external-secrets, and external-secrets doesn't need
  # them -- they just share wave 0 because none of the three needs
  # anything a prior wave of this Application produces.
  #
  # openbao's own server-side OIDC calls to https://auth.scalepack.fr
  # (vault_jwt_auth_backend.oidc, 11-secrets/openbao/managed) trust the
  # Let's Encrypt staging CA via that Terraform resource's own
  # oidc_discovery_ca_pem field -- a native per-provider CA override, no
  # pod-level values file / init container needed here at all (an earlier
  # design tried that and hit OpenBao's own securityContext blocking `apk
  # add`, see main.tf's own comment on var.letsencrypt_staging).
  - {name: openbao, namespace: openbao, chartPath: services/platform/openbao/chart, valueFile: values-scaleway.yaml, wave: "0", syncWaveLabelPaths: ['openbao.server.extraLabels.scalepack\.fr/sync-wave']}
  - {name: openbao-init, namespace: openbao, chartPath: services/platform/openbao/init, valueFile: values-scaleway.yaml, wave: "0"}
  # external-secrets manages its own CRDs (2026-08-27 revert -- see
  # values-crds.yaml's own comment): this wave/next-wave split is what
  # orders secrets-sync's ClusterSecretStore/PushSecret after
  # external-secrets.io's CRDs are actually Established.
  - {name: external-secrets, namespace: external-secrets, chartPath: services/platform/external-secrets/chart, valueFile: values-scaleway.yaml, wave: "0", syncWaveLabelPaths: ['external-secrets.podLabels.scalepack\.fr/sync-wave', 'external-secrets.webhook.podLabels.scalepack\.fr/sync-wave', 'external-secrets.certController.podLabels.scalepack\.fr/sync-wave']}
  # ── wave 1: needs OpenBao serving Kubernetes-auth logins + ESO's CRDs ──
  # secrets-sync's ClusterSecretStore logs into OpenBao (Kubernetes auth)
  # and its PushSecret is external-secrets.io-typed -- wave 0 being Healthy
  # guarantees both OpenBao is genuinely settled (raft-snapshot restore
  # done, Kubernetes auth backend reloaded -- the guarantee the old
  # wait_standalone_healthy Job enforced across Applications) and the
  # external-secrets.io CRDs are Established.
  - {name: secrets-sync, namespace: secrets-sync, chartPath: services/platform/secrets-sync/config, valueFile: values-scaleway.yaml, wave: "1"}
  # ── wave 2: needs ESO's ValidatingWebhookConfiguration actually serving ─
  # Every product's ExternalSecret across every platform domain. wave 1
  # being Healthy guarantees external-secrets' webhook component is up --
  # without that guarantee these fail outright on a hard, non-self-healing
  # sync error (confirmed live 2026-08-26 as the old eso-data-apps, which
  # is exactly why it needed wait_secrets_healthy across the Application
  # boundary; that hop is this wave boundary now). None of these depend on
  # each other, only on wave 1.
  - {name: dex-secret, namespace: gateway, chartPath: services/platform/dex/secret, valueFile: values.yaml, wave: "2"}
  - {name: grafana-secret, namespace: monitoring, chartPath: services/platform/monitoring/grafana-secret, valueFile: values.yaml, wave: "2"}
  - {name: wireguard-secret, namespace: wireguard, chartPath: services/platform/wireguard-site-to-site/secret, valueFile: values-scaleway.yaml, wave: "2"}
  - {name: argo-workflows-secret, namespace: argo-workflows, chartPath: services/platform/argo-workflows/secret, valueFile: values.yaml, wave: "2"}
  # argocd-config-secret: split out of services/platform/argocd-config/config
  # (which used to bundle this ExternalSecret with the PostSync
  # argocd-server restart hook) -- same "<product>/secret split out of a
  # mixed chart" treatment gitops repo's bootstrap/README.md documents for
  # dex/grafana back when they first needed it.
  - {name: argocd-config-secret, namespace: argocd, chartPath: services/platform/argocd-config/secret, valueFile: values.yaml, wave: "2"}
  - {name: cert-manager-webhook-secret, namespace: cert-manager, chartPath: services/platform/cert-manager/webhook-secret, valueFile: values.yaml, wave: "2"}
  - {name: external-dns-secret, namespace: external-dns, chartPath: services/platform/external-dns/secret, valueFile: values.yaml, wave: "2"}
