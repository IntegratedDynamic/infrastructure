# kind CI tier (infra#110) -- same secrets-apps tree as values-secrets.yaml,
# with exactly two swaps (everything else identical, kept in sync by hand
# same as this file's sibling values-*-kind.yaml overrides):
#  - openbao: valueFile: values-kind.yaml (gitops repo) instead of
#    values-scaleway.yaml -- disables the periodic snapshotAgent CronJob
#    only; seal "awskms" and openbao-unseal-aws stay IDENTICAL to
#    production, on purpose (10-cluster/kind/main.tf restores OpenBao from
#    a REAL production raft snapshot -- see that file's header comment for
#    why a fresh throwaway instance was rejected). A kind CI run must never
#    be able to WRITE a new snapshot back into the real backup bucket, only
#    read the latest one.
#  - secrets-sync: valueFile: values-local.yaml instead of
#    values-scaleway.yaml -- that chart's own existing "dev, disposable
#    cluster" variant (targets: []) so this tier never pushes real values
#    into the GitHub org's secrets, the same reasoning the now-deleted
#    10-cluster/local minikube root originally relied on for this variant.
#
# Every wave-2 product ExternalSecret is otherwise KEPT (unlike an earlier
# draft of this file): restoring the real snapshot means OpenBao's KV
# actually has real values for them, so this tier can validate real
# ExternalSecret reconciliation for dex/grafana/argocd-config/argo-workflows/
# cert-manager-webhook/external-dns, not just secrets-apps in isolation.
# wireguard-secret dropped -- no wireguard-apps domain in this tier to
# consume it (10-cluster/kind/argocd.tf's own header comment).
apps:
  # ── wave 0 ──────────────────────────────────────────────────────────────
  - {name: openbao, namespace: openbao, chartPath: services/platform/openbao/chart, valueFile: values-kind.yaml, wave: "0", syncWaveLabelPaths: ['openbao.server.extraLabels.scalepack\.fr/sync-wave']}
  - {name: openbao-init, namespace: openbao, chartPath: services/platform/openbao/init, valueFile: values-scaleway.yaml, wave: "0"}
  - {name: external-secrets, namespace: external-secrets, chartPath: services/platform/external-secrets/chart, valueFile: values-scaleway.yaml, wave: "0", syncWaveLabelPaths: ['external-secrets.podLabels.scalepack\.fr/sync-wave', 'external-secrets.webhook.podLabels.scalepack\.fr/sync-wave', 'external-secrets.certController.podLabels.scalepack\.fr/sync-wave']}
  - {name: reloader, namespace: reloader, chartPath: services/platform/reloader/chart, valueFile: values-scaleway.yaml, wave: "0"}
  # ── wave 1 ──────────────────────────────────────────────────────────────
  - {name: secrets-sync, namespace: secrets-sync, chartPath: services/platform/secrets-sync/config, valueFile: values-local.yaml, wave: "1"}
  # ── wave 2 ──────────────────────────────────────────────────────────────
  - {name: dex-secret, namespace: gateway, chartPath: services/platform/dex/secret, valueFile: values.yaml, wave: "2"}
  - {name: grafana-secret, namespace: monitoring, chartPath: services/platform/monitoring/grafana-secret, valueFile: values.yaml, wave: "2"}
  - {name: argo-workflows-secret, namespace: argo-workflows, chartPath: services/platform/argo-workflows/secret, valueFile: values.yaml, wave: "2"}
  - {name: argocd-config-secret, namespace: argocd, chartPath: services/platform/argocd-config/secret, valueFile: values.yaml, wave: "2"}
  - {name: cert-manager-webhook-secret, namespace: cert-manager, chartPath: services/platform/cert-manager/webhook-secret, valueFile: values.yaml, wave: "2"}
  - {name: external-dns-secret, namespace: external-dns, chartPath: services/platform/external-dns/secret, valueFile: values.yaml, wave: "2"}
