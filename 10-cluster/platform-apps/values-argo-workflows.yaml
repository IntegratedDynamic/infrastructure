# Argo Workflows (controller + server) -- extracted from gitops repo's
# bootstrap/values.yaml (infra#84 follow-up). argo-workflows-secret lives in
# secrets-apps' wave 2 now (values-secrets.yaml; argocd.tf's
# helm_release.argo_workflows_apps depends_on helm_release.secrets_apps) --
# this domain just consumes the Secrets it materializes.
#
# argo-workflows/chart eager-dials Dex's OIDC issuer at pod startup
# (server.sso.issuer, http://dex.gateway.svc:5556) and crash-loops if Dex
# isn't reachable yet -- a real hard dependency, unlike ESO's
# self-heals-via-refreshInterval tolerance. This domain therefore depends on
# a health wait on dex-apps (argocd.tf's wait_dex_healthy gate), not just a
# raw depends_on.
#
# argo-workflows-gateway's HTTPRoute moved OUT to
# networking-resources-apps' wave 1 (values-networking-resources.yaml --
# was the separate `gateways-apps` domain, merged in 2026-08-27) --
# argo-workflows itself has no
# Gateway API dependency, only its own gateway sibling did, and bundling it
# here used to force this domain's health to wait on networking-apps' CRDs
# transitively via dex-apps -- moot now that dex-apps itself no longer
# carries that dependency either (see values-dex.yaml). See
# platform-apps/README.md's "Decoupling gateway routes from
# wait_networking_healthy" section.
apps:
  - {name: argo-workflows, namespace: argo-workflows, chartPath: services/platform/argo-workflows/chart, valueFile: values-scaleway.yaml, wave: "0", syncWaveLabelPaths: ['argo-workflows.controller.podLabels.scalepack\.fr/sync-wave']}
