# Everything that captures/stores cluster data — extracted from gitops
# repo's bootstrap/values.yaml waves 2-4 (infra#84). Grafana itself (pure
# consumption/UI, not capture) stays in gitops repo's bootstrap, unaffected
# — it only needs this domain's `velero` sibling (backups domain, for its
# grafana-restore-* PreSync hook) to exist, which is now guaranteed true
# well before bootstrap even starts syncing.
#
# thanos-objstore-config / loki-s3-credentials / tempo-s3-credentials: no
# longer ExternalSecret-materialized charts here (gitops repo's former
# monitoring/thanos-secret, loki-secret, tempo-secret — deleted) — this
# repo's main.tf now writes those Kubernetes Secrets directly (still also
# written to OpenBao KV by 11-secrets/openbao/managed, which stays the
# audited source of truth for the credential values themselves; see that
# root's vault_kv_secret_v2 resources), since Terraform already owns the
# bucket + IAM identity these credentials come from (03-storage/scaleway) —
# no ESO round-trip needed for a credential Terraform originates itself.
apps:
  # ── wave 0 ──────────────────────────────────────────────────────────────
  # kube-prometheus-stack-crds moved to the shared `crds-apps` domain
  # (values-crds.yaml, 2026-08-26) — every Tier-0 domain including this one
  # is now gated on it being Established before it's even created
  # (module.wait_crds_healthy in argocd.tf), so kube-prometheus-stack
  # (skipCrds: true, since crds-apps owns them now) can safely share wave 0
  # with everything else in this domain instead of needing its own earlier
  # wave. Real prerequisites otherwise: this repo's directly-provisioned
  # Secrets above — nothing cert-manager/gateway/dex-related (those stay in
  # gitops repo's bootstrap, unaffected).
  - {name: kube-prometheus-stack, namespace: monitoring, chartPath: services/platform/monitoring/chart, valueFile: values-scaleway.yaml, wave: "0", skipCrds: true, syncWaveLabelPaths: ['kube-prometheus-stack.prometheus.prometheusSpec.podMetadata.labels.scalepack\.fr/sync-wave', 'kube-prometheus-stack.prometheusOperator.podLabels.scalepack\.fr/sync-wave']}
  - {name: loki, namespace: monitoring, chartPath: services/platform/monitoring/loki-chart, valueFile: values-scaleway.yaml, wave: "0"}
  - {name: tempo, namespace: monitoring, chartPath: services/platform/monitoring/tempo-chart, valueFile: values-scaleway.yaml, wave: "0"}
  # argocd-config-monitoring: a PrometheusRule, needs crds-apps'
  # kube-prometheus-stack-crds Established (the monitoring.coreos.dev CRDs,
  # guaranteed before this wave even starts) -- moved here from gitops
  # repo's bootstrap (infra#84 follow-up) since its only real dependency is
  # those CRDs, nothing argocd-config-related despite the name (inherited
  # from its chartPath).
  - {name: argocd-config-monitoring, namespace: argocd, chartPath: services/platform/argocd-config/monitoring, valueFile: values.yaml, wave: "0"}

  # ── wave 1 ──────────────────────────────────────────────────────────────
  # alloy / otel-collector: one wave after loki/tempo — both need the
  # loki/tempo Services resolvable, not just created.
  - {name: alloy, namespace: monitoring, chartPath: services/platform/monitoring/alloy-chart, valueFile: values-scaleway.yaml, wave: "1"}
  - {name: otel-collector, namespace: monitoring, chartPath: services/platform/otel-collector/chart, valueFile: values-scaleway.yaml, wave: "1"}
