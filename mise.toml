[tools]
kubectl = "1.35"
minikube = "1.38"
terraform = "1.14"
actionlint = "1.7"
helm = "4.1.3"
argocd = "3.3.6"

# ── Local (minikube) ────────────────────────────────────────────────────────

[tasks.minikube]
run = """
# Start Docker if not running
if ! docker info > /dev/null 2>&1; then
  echo "Docker is not running. Starting Docker..."
  open -a Docker

  # Wait until Docker is ready
  echo "Waiting for Docker to be ready..."
  while ! docker info > /dev/null 2>&1; do
    sleep 2
  done
fi
minikube start --driver=docker
kubectl wait --for=condition=Ready nodes --all --timeout=120s
"""

[tasks.local-init]
dir = "10-cluster/local"
run = """
terraform init
"""

[tasks.local-apply]
dir = "10-cluster/local"
run = """
ws=$(terraform workspace show)
if [ "$ws" = "default" ]; then
  echo "error: terraform workspace is 'default' — select a real workspace first (terraform workspace select <env>)" >&2
  exit 1
fi
terraform apply -auto-approve -var-file="env/${ws}.tfvars" $(test -f default.auto.tfvars && echo "-var-file=default.auto.tfvars")
"""

[tasks.dev]
description = "Full local dev environment (minikube + ArgoCD)"
run = """
mise run minikube
mise run local-init
mise run local-apply
"""

[tasks.reset]
description = "Reset local minikube cluster"
run = "minikube delete"


# ── VPN (WireGuard, 04-vpn/wireguard-site-to-site) ───────────────────────────
# `wg-quick`'s own "bare name" lookup only resolves configs already living in
# its own directory (/opt/homebrew/etc/wireguard on macOS) — not the ones
# written under generated/. These just point it at the right file so the
# whole workflow is `mise run vpn-generate` once, then `vpn-up`/`vpn-down`
# — no path wrangling, no `wg-quick: ...conf.conf' does not exist`
# surprises. Requires wireguard-tools (`brew install wireguard-tools` on
# macOS) — not mise-managed, no mise plugin for it.

[tasks.vpn-generate]
usage = 'arg "<peer>" help="Peer name from 04-vpn/wireguard-site-to-site/variables.tf var.peers" default="nicolas"'
description = "Write your own WireGuard config to disk (never anyone else's)"
dir = "04-vpn/wireguard-site-to-site"
run = """
terraform init
terraform workspace select -or-create 04-network-wireguard
terraform apply -var-file=env/04-network-wireguard.tfvars
mkdir -p generated
terraform output -json peer_confs | jq -r --arg peer "${usage_peer?}" '.[$peer]' > "generated/${usage_peer?}.conf"
chmod 600 "generated/${usage_peer?}.conf"
echo "wrote generated/${usage_peer?}.conf"
"""

[tasks.vpn-up]
usage = 'arg "<peer>" help="Peer name from 04-vpn/wireguard-site-to-site/variables.tf var.peers" default="nicolas"'
description = "Bring up your WireGuard tunnel to OpenBao"
dir = "04-vpn/wireguard-site-to-site"
run = """
conf="generated/${usage_peer?}.conf"
if [ ! -f "$conf" ]; then
  echo "error: $conf not found — run 'mise run vpn-generate' first" >&2
  exit 1
fi
sudo wg-quick up "$(pwd)/$conf"
"""

[tasks.vpn-down]
usage = 'arg "<peer>" help="Peer name from 04-vpn/wireguard-site-to-site/variables.tf var.peers" default="nicolas"'
description = "Tear down your WireGuard tunnel"
dir = "04-vpn/wireguard-site-to-site"
run = 'sudo wg-quick down "$(pwd)/generated/${usage_peer?}.conf"'

# ── VPN exit node (WireGuard, 04-vpn/wireguard-exit) ─────────────────────────
# Same generate/up/down shape as the site-to-site tunnel above, pointed at
# the separate exit-node root — different keys, different overlay subnet,
# routes ALL of the peer's traffic (not just OpenBao) through the cluster's
# public IP. See 04-vpn/wireguard-exit/README.md.

[tasks.vpn-exit-generate]
usage = 'arg "<peer>" help="Peer name from 04-vpn/wireguard-exit/variables.tf var.peers" default="nicolas"'
description = "Write your own WireGuard exit-node config to disk (never anyone else's)"
dir = "04-vpn/wireguard-exit"
run = """
terraform init
terraform workspace select -or-create 04-network-wireguard-exit
terraform apply -var-file=env/04-network-wireguard-exit.tfvars
mkdir -p generated
terraform output -json peer_confs | jq -r --arg peer "${usage_peer?}" '.[$peer]' > "generated/${usage_peer?}.conf"
chmod 600 "generated/${usage_peer?}.conf"
echo "wrote generated/${usage_peer?}.conf"
"""

[tasks.vpn-exit-up]
usage = 'arg "<peer>" help="Peer name from 04-vpn/wireguard-exit/variables.tf var.peers" default="nicolas"'
description = "Bring up your WireGuard exit-node tunnel (routes all your traffic through the cluster)"
dir = "04-vpn/wireguard-exit"
run = """
conf="generated/${usage_peer?}.conf"
if [ ! -f "$conf" ]; then
  echo "error: $conf not found — run 'mise run vpn-exit-generate' first" >&2
  exit 1
fi
sudo wg-quick up "$(pwd)/$conf"
"""

[tasks.vpn-exit-down]
usage = 'arg "<peer>" help="Peer name from 04-vpn/wireguard-exit/variables.tf var.peers" default="nicolas"'
description = "Tear down your WireGuard exit-node tunnel"
dir = "04-vpn/wireguard-exit"
run = 'sudo wg-quick down "$(pwd)/generated/${usage_peer?}.conf"'


# ── Backups (on-demand, out-of-band from each schedule's own cron) ──────────
# Useful right after standing up a fresh cluster/schedule (no backup history
# yet to restore from) or before a deliberate rebuild you want to test
# restore against. Schedule names match services/platform/velero/chart/
# values-scaleway.yaml (gitops repo) — see that file + this repo's
# services/platform/gateway/config/README.md for the full restore-hook
# writeup. Selecting the velero pod by the `name=velero` label (not
# `app.kubernetes.io/name=velero`, which the node-agent DaemonSet pods
# share) — `kubectl exec deploy/velero` has been observed picking a
# node-agent pod instead, confirmed live 2026-08-14.

[tasks.backup-now]
description = "Trigger an on-demand backup: both Velero schedules + an OpenBao snapshot"
run = """
set -eu
velero_pod=$(kubectl get pod -n velero -l name=velero -o jsonpath='{.items[0].metadata.name}')

kubectl exec -n velero "$velero_pod" -c velero -- /velero backup create --from-schedule velero-cert-secrets --wait
kubectl exec -n velero "$velero_pod" -c velero -- /velero backup create --from-schedule velero-grafana-data --wait

job="openbao-snapshot-manual-$(date +%s)"
kubectl create job --from=cronjob/openbao-snapshot "$job" -n openbao
kubectl wait --for=condition=complete "job/$job" -n openbao --timeout=60s
kubectl logs -n openbao "job/$job" --tail=5
"""


# ── Provider locks ───────────────────────────────────────────────────────────

[tasks.lock]
description = "Re-generate all .terraform.lock.hcl files for darwin_arm64 + linux_amd64"
run = """
terraform -chdir=00-foundation/aws                providers lock -platform=darwin_arm64 -platform=linux_amd64
terraform -chdir=01-iam/bootstrap/aws               providers lock -platform=darwin_arm64 -platform=linux_amd64
terraform -chdir=01-iam/bootstrap/scaleway          providers lock -platform=darwin_arm64 -platform=linux_amd64
terraform -chdir=01-iam/workload/scaleway           providers lock -platform=darwin_arm64 -platform=linux_amd64
terraform -chdir=02-encryption/aws                  providers lock -platform=darwin_arm64 -platform=linux_amd64
terraform -chdir=03-storage/scaleway                providers lock -platform=darwin_arm64 -platform=linux_amd64
terraform -chdir=04-vpn/wireguard-site-to-site      providers lock -platform=darwin_arm64 -platform=linux_amd64
terraform -chdir=04-vpn/wireguard-exit              providers lock -platform=darwin_arm64 -platform=linux_amd64
terraform -chdir=05-secrets/openbao/bootstrap        providers lock -platform=darwin_arm64 -platform=linux_amd64
terraform -chdir=10-cluster/local                   providers lock -platform=darwin_arm64 -platform=linux_amd64
terraform -chdir=10-cluster/scaleway                providers lock -platform=darwin_arm64 -platform=linux_amd64
"""
