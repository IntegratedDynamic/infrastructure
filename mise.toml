[tools]
kubectl = "1.35"
minikube = "1.38"
opentofu = "1.12"
actionlint = "1.7"
helm = "4.1.3"
argocd = "3.3.6"

# ── Local (minikube) ────────────────────────────────────────────────────────

[tasks.minikube]
run = """
# Start Docker if not running
if ! docker info > /dev/null 2>&1; then
  echo "Docker is not running. Starting Docker..."
  open -a Docker

  # Wait until Docker is ready
  echo "Waiting for Docker to be ready..."
  while ! docker info > /dev/null 2>&1; do
    sleep 2
  done
fi
minikube start --driver=docker
kubectl wait --for=condition=Ready nodes --all --timeout=120s
"""

[tasks.local-init]
dir = "10-cluster/local"
run = """
tofu init
"""

[tasks.local-apply]
dir = "10-cluster/local"
run = """
ws=$(tofu workspace show)
if [ "$ws" = "default" ]; then
  echo "error: tofu workspace is 'default' — select a real workspace first (tofu workspace select <env>)" >&2
  exit 1
fi
tofu apply -auto-approve -var-file="env/${ws}.tfvars" $(test -f default.auto.tfvars && echo "-var-file=default.auto.tfvars")
"""

[tasks.dev]
description = "Full local dev environment (minikube + ArgoCD)"
run = """
mise run minikube
mise run local-init
mise run local-apply
"""

[tasks.reset]
description = "Reset local minikube cluster"
run = "minikube delete"


# ── VPN (WireGuard, 04-vpn/wireguard-site-to-site) ───────────────────────────
# `wg-quick`'s own "bare name" lookup only resolves configs already living in
# its own directory (/opt/homebrew/etc/wireguard on macOS) — not the ones
# written under generated/. These just point it at the right file so the
# whole workflow is `mise run vpn-generate` once, then `vpn-up`/`vpn-down`
# — no path wrangling, no `wg-quick: ...conf.conf' does not exist`
# surprises. Requires wireguard-tools (`brew install wireguard-tools` on
# macOS) — not mise-managed, no mise plugin for it.

[tasks.vpn-generate]
usage = 'arg "<peer>" help="Peer name from 04-vpn/wireguard-site-to-site/variables.tf var.peers" default="nicolas"'
description = "Write your own WireGuard config to disk (never anyone else's)"
dir = "04-vpn/wireguard-site-to-site"
run = """
tofu init
tofu workspace select -or-create 04-vpn-wireguard-site-to-site-dev
tofu apply -var-file=env/04-vpn-wireguard-site-to-site-dev.tfvars
mkdir -p generated
tofu output -json peer_confs | jq -r --arg peer "${usage_peer?}" '.[$peer]' > "generated/${usage_peer?}.conf"
chmod 600 "generated/${usage_peer?}.conf"
echo "wrote generated/${usage_peer?}.conf"
"""

[tasks.vpn-up]
usage = 'arg "<peer>" help="Peer name from 04-vpn/wireguard-site-to-site/variables.tf var.peers" default="nicolas"'
description = "Bring up your WireGuard tunnel to OpenBao"
dir = "04-vpn/wireguard-site-to-site"
run = """
conf="generated/${usage_peer?}.conf"
if [ ! -f "$conf" ]; then
  echo "error: $conf not found — run 'mise run vpn-generate' first" >&2
  exit 1
fi
sudo wg-quick up "$(pwd)/$conf"
"""

[tasks.vpn-down]
usage = 'arg "<peer>" help="Peer name from 04-vpn/wireguard-site-to-site/variables.tf var.peers" default="nicolas"'
description = "Tear down your WireGuard tunnel"
dir = "04-vpn/wireguard-site-to-site"
run = 'sudo wg-quick down "$(pwd)/generated/${usage_peer?}.conf"'

# ── VPN exit node (WireGuard, 04-vpn/wireguard-exit) ─────────────────────────
# Same generate/up/down shape as the site-to-site tunnel above, pointed at
# the separate exit-node root — different keys, different overlay subnet,
# routes ALL of the peer's traffic (not just OpenBao) through the cluster's
# public IP. See 04-vpn/wireguard-exit/README.md.

[tasks.vpn-exit-generate]
usage = 'arg "<peer>" help="Peer name from 04-vpn/wireguard-exit/variables.tf var.peers" default="nicolas"'
description = "Write your own WireGuard exit-node config to disk (never anyone else's)"
dir = "04-vpn/wireguard-exit"
run = """
tofu init
tofu workspace select -or-create 04-vpn-wireguard-exit-dev
tofu apply -var-file=env/04-vpn-wireguard-exit-dev.tfvars
mkdir -p generated
tofu output -json peer_confs | jq -r --arg peer "${usage_peer?}" '.[$peer]' > "generated/${usage_peer?}.conf"
chmod 600 "generated/${usage_peer?}.conf"
echo "wrote generated/${usage_peer?}.conf"
"""

[tasks.vpn-exit-up]
usage = 'arg "<peer>" help="Peer name from 04-vpn/wireguard-exit/variables.tf var.peers" default="nicolas"'
description = "Bring up your WireGuard exit-node tunnel (routes all your traffic through the cluster)"
dir = "04-vpn/wireguard-exit"
run = """
conf="generated/${usage_peer?}.conf"
if [ ! -f "$conf" ]; then
  echo "error: $conf not found — run 'mise run vpn-exit-generate' first" >&2
  exit 1
fi
sudo wg-quick up "$(pwd)/$conf"
"""

[tasks.vpn-exit-down]
usage = 'arg "<peer>" help="Peer name from 04-vpn/wireguard-exit/variables.tf var.peers" default="nicolas"'
description = "Tear down your WireGuard exit-node tunnel"
dir = "04-vpn/wireguard-exit"
run = 'sudo wg-quick down "$(pwd)/generated/${usage_peer?}.conf"'


# ── Scaleway (10-cluster/scaleway) ───────────────────────────────────────────
# Local-admin fallback for iterating on this root directly -- CI down (e.g.
# a GitHub Actions outage), or just faster than a push+dispatch round-trip.
# Mirrors .github/actions/terraform/action.yml's own apply/destroy/
# hard-destroy commands exactly. Workspace/tfvars hardcoded (not derived
# like [tasks.local-apply]'s `tofu workspace show`) since this root has
# exactly one dev environment. Exports AWS_ACCESS_KEY_ID/
# AWS_SECRET_ACCESS_KEY from `scw config get` itself, every task -- see this
# file's own header comment / CLAUDE.md's Setup section for why the s3
# backend needs those two literal env var names specifically; `scw config
# info` showing valid credentials does not mean the backend has them.

[tasks.scaleway-plan]
description = "tofu plan against the live Scaleway homelab cluster"
dir = "10-cluster/scaleway"
run = """
export AWS_ACCESS_KEY_ID=$(scw config get access-key)
export AWS_SECRET_ACCESS_KEY=$(scw config get secret-key)
tofu init
tofu workspace select -or-create 10-cluster-scaleway-dev
tofu plan -var-file=env/10-cluster-scaleway-dev.tfvars
"""

[tasks.scaleway-apply]
description = "tofu apply against the live Scaleway homelab cluster"
dir = "10-cluster/scaleway"
run = """
export AWS_ACCESS_KEY_ID=$(scw config get access-key)
export AWS_SECRET_ACCESS_KEY=$(scw config get secret-key)
tofu init
tofu workspace select -or-create 10-cluster-scaleway-dev
tofu apply -auto-approve -var-file=env/10-cluster-scaleway-dev.tfvars
"""

[tasks.scaleway-destroy]
description = "Graceful tofu destroy of the Scaleway homelab cluster"
dir = "10-cluster/scaleway"
run = """
export AWS_ACCESS_KEY_ID=$(scw config get access-key)
export AWS_SECRET_ACCESS_KEY=$(scw config get secret-key)
tofu init
tofu workspace select 10-cluster-scaleway-dev
tofu destroy -auto-approve -var-file=env/10-cluster-scaleway-dev.tfvars
"""

[tasks.scaleway-hard-destroy]
description = "Fast destroy: strip helm_release/kubernetes_* from state first, so destroy only has to delete the cluster itself"
dir = "10-cluster/scaleway"
run = """
export AWS_ACCESS_KEY_ID=$(scw config get access-key)
export AWS_SECRET_ACCESS_KEY=$(scw config get secret-key)
tofu init
tofu workspace select 10-cluster-scaleway-dev
addrs=$(tofu state list | awk -F. '{ n = NF; type = $(n-1); name = $n; if (type == "helm_release" || type ~ /^kubernetes_/ || (type == "null_resource" && name == "velero_namespace_predelete_cleanup")) print }')
if [ -z "$addrs" ]; then
  echo "Nothing to strip -- already gone or never created."
else
  echo "$addrs"
  echo "$addrs" | xargs tofu state rm
fi
tofu destroy -auto-approve -var-file=env/10-cluster-scaleway-dev.tfvars
"""


# ── Backups (on-demand, out-of-band from each schedule's own cron) ──────────
# Useful right after standing up a fresh cluster/schedule (no backup history
# yet to restore from) or before a deliberate rebuild you want to test
# restore against. Schedule names match services/platform/velero/chart/
# values-scaleway.yaml (gitops repo) — see that file + this repo's
# services/platform/gateway/config/README.md for the full restore-hook
# writeup. Selecting the velero pod by the `name=velero` label (not
# `app.kubernetes.io/name=velero`) — historically also matched the
# node-agent DaemonSet's pods, causing `kubectl exec deploy/velero` to pick
# the wrong one (confirmed live 2026-08-14); moot since infra#75 dropped
# that DaemonSet entirely (grafana-data now backs up via CSI VolumeSnapshot,
# not kopia file-system-backup), but the narrower selector is still the
# more correct one to keep.

[tasks.backup-now]
description = "Trigger an on-demand backup: both Velero schedules + an OpenBao snapshot"
run = """
set -eu
velero_pod=$(kubectl get pod -n velero -l name=velero -o jsonpath='{.items[0].metadata.name}')

kubectl exec -n velero "$velero_pod" -c velero -- /velero backup create --from-schedule velero-cert-secrets --wait
kubectl exec -n velero "$velero_pod" -c velero -- /velero backup create --from-schedule velero-grafana-data --wait

job="openbao-snapshot-manual-$(date +%s)"
kubectl create job --from=cronjob/openbao-snapshot "$job" -n openbao
kubectl wait --for=condition=complete "job/$job" -n openbao --timeout=60s
kubectl logs -n openbao "job/$job" --tail=5
"""


# ── Provider locks ───────────────────────────────────────────────────────────

[tasks.lock]
description = "Re-generate all .terraform.lock.hcl files for darwin_arm64 + linux_amd64"
run = """
tofu -chdir=00-foundation/aws                providers lock -platform=darwin_arm64 -platform=linux_amd64
tofu -chdir=00-foundation/scaleway             providers lock -platform=darwin_arm64 -platform=linux_amd64
tofu -chdir=01-iam/bootstrap/aws               providers lock -platform=darwin_arm64 -platform=linux_amd64
tofu -chdir=01-iam/bootstrap/scaleway          providers lock -platform=darwin_arm64 -platform=linux_amd64
tofu -chdir=01-iam/workload/scaleway           providers lock -platform=darwin_arm64 -platform=linux_amd64
tofu -chdir=02-encryption/aws                  providers lock -platform=darwin_arm64 -platform=linux_amd64
tofu -chdir=03-storage/scaleway                providers lock -platform=darwin_arm64 -platform=linux_amd64
tofu -chdir=04-vpn/wireguard-site-to-site      providers lock -platform=darwin_arm64 -platform=linux_amd64
tofu -chdir=04-vpn/wireguard-exit              providers lock -platform=darwin_arm64 -platform=linux_amd64
tofu -chdir=10-cluster/local                   providers lock -platform=darwin_arm64 -platform=linux_amd64
tofu -chdir=10-cluster/scaleway                providers lock -platform=darwin_arm64 -platform=linux_amd64
tofu -chdir=11-secrets/openbao/bootstrap        providers lock -platform=darwin_arm64 -platform=linux_amd64
tofu -chdir=11-secrets/openbao/managed          providers lock -platform=darwin_arm64 -platform=linux_amd64
tofu -chdir=12-monitoring/grafana/bootstrap     providers lock -platform=darwin_arm64 -platform=linux_amd64
tofu -chdir=12-monitoring/grafana/managed       providers lock -platform=darwin_arm64 -platform=linux_amd64
"""
