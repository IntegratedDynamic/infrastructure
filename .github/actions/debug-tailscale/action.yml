name: Debug via Tailscale
description: >
  Join this runner to the platform's headscale network under tag:ci-debug with
  Tailscale SSH enabled, so both a human and Claude can `ssh runner@<hostname>`
  straight into it. Drop this step into any workflow that needs live debugging.
  See the root CLAUDE.md's "Live debugging via Tailscale SSH" section.

  No stored secret: the job presents its own GitHub Actions OIDC token to
  headscale-sts (gitops repo, services/platform/headscale), which returns a
  single-use, ephemeral, 5-minute preauth key. The calling job MUST set
  `permissions: id-token: write` (a composite action cannot grant it itself).

  headscale runs in the homelab cluster: while the cluster is down, this step
  only warns and the job carries on without live debugging.

inputs:
  login-server:
    description: URL of the headscale server.
    required: false
    default: https://headscale.staging.scalepack.fr
  hostname:
    description: >
      Tailscale hostname for this node (must be a valid DNS label: 1-63
      chars, alphanumeric + dashes). Default makes it derivable by anyone
      who knows the job ID + run ID -- no session-ID relay needed:
      `ssh runner@<job>-<run_id>` (runner@ -- that's the actual local user
      on a GitHub-hosted runner, confirmed live 2026-09-17). Deliberately
      github.job (the YAML job key, e.g.
      "kind"), not github.workflow (that workflow's free-text `name:`,
      "kind — fast platform-apps DAG validation" for kind.yml -- spaces and
      an em dash, not a valid DNS label at all; github.job is always
      identifier-safe, GitHub itself enforces that at the job-key syntax
      level).
    required: false
    default: ${{ github.job }}-${{ github.run_id }}

runs:
  using: composite
  steps:
    - name: Get a headscale preauth key
      id: authkey
      shell: bash
      env:
        LOGIN_SERVER: ${{ inputs.login-server }}
      run: bash "$GITHUB_ACTION_PATH/get-authkey.sh"

    # The node is ephemeral and already tagged by the key: headscale removes it
    # once the runner disconnects.
    - uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
      if: steps.authkey.outputs.key != ''
      with:
        authkey: ${{ steps.authkey.outputs.key }}
        hostname: ${{ inputs.hostname }}
        # --ssh: Tailscale SSH, genuine SSH protocol:
        # `ssh runner@<hostname> '<command>'` just works.
        args: --ssh --login-server=${{ inputs.login-server }}
