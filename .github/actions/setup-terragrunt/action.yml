name: Setup Terragrunt
description: >
  Install a pinned Terragrunt release on a Linux runner, verified against the
  release's own SHA256SUMS. OpenTofu is installed separately
  (opentofu/setup-opentofu): Terragrunt calls `tofu` from PATH by default.

inputs:
  version:
    description: >
      Terragrunt version, without the leading "v". Keep the default in sync with
      mise.toml [tools] terragrunt (which only pins the minor: it resolves to the
      latest patch, this pins the exact one CI runs).
    required: false
    default: "1.2.3"

runs:
  using: composite
  steps:
    - name: Install Terragrunt
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        base="https://github.com/gruntwork-io/terragrunt/releases/download/v${VERSION}"
        tmp="$(mktemp -d)"
        curl -fsSL -o "${tmp}/terragrunt_linux_amd64" "${base}/terragrunt_linux_amd64"
        curl -fsSL -o "${tmp}/SHA256SUMS" "${base}/SHA256SUMS"
        # `-c` fails if the line is missing, so a renamed asset can't pass silently.
        (cd "${tmp}" && grep ' terragrunt_linux_amd64$' SHA256SUMS | sha256sum -c -)
        sudo install -m 0755 "${tmp}/terragrunt_linux_amd64" /usr/local/bin/terragrunt
        terragrunt --version
