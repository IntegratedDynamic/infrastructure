name: Terraform
description: >
  Run Terraform for a workspace-driven root: set up Terraform, optionally mint an
  Infisical OIDC token, authenticate the S3-compatible state backend, then init →
  workspace select → plan/apply/destroy. The repository must already be checked out.

  Backend auth has two modes (`state-backend` input), because this repo's roots
  are split across two remote-state homes (see 00-foundation/scaleway/README.md):
    - "aws"      (default): assume an AWS IAM role via OIDC (`aws-role-arn`).
                 For a root whose state still lives in the 00-foundation/aws
                 bucket, or that also carries a real `provider "aws"` block for
                 its own resources.
    - "scaleway": no role assumed — SCALEWAY_STATE_ACCESS_KEY/SCALEWAY_STATE_SECRET_KEY
                 (already in the job env below) are exported as
                 AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY just for the backend,
                 since Terraform's s3 backend only ever reads those two literal
                 env var names. Deliberately NOT the same pair as the
                 `provider "scaleway" {}` credentials (SCW_ACCESS_KEY/
                 SCW_SECRET_KEY, a general-purpose CI identity) — that identity
                 can read/write state objects but was never granted delete, so
                 it can create the S3 native lock but not release it
                 (confirmed live 2026-08-25: DeleteObject 403 on lock release).
                 SCALEWAY_STATE_ACCESS_KEY/_SECRET_KEY is the state bucket's own
                 dedicated identity instead (00-foundation/scaleway's
                 per-bucket identities — full CRUD on just that one bucket),
                 fed to GitHub via OpenBao+ESO (see 11-secrets/openbao/managed's
                 secrets_sync_github_infrastructure_scaleway and the gitops
                 repo's services/platform/secrets-sync). Only safe for a root
                 with no real `provider "aws"` block of its own (otherwise the
                 two collide) — e.g. 10-cluster/scaleway.

  This action takes NO secret inputs. Provider credentials are read from the
  calling job's environment (set them there — the reusable terraform.yml workflow
  does, sourcing SCW_ACCESS_KEY/SCW_SECRET_KEY from its `secrets:` block):
    - SCW_ACCESS_KEY / SCW_SECRET_KEY          (Scaleway API key, provider auth)
    - SCALEWAY_STATE_ACCESS_KEY / _SECRET_KEY  (state-backend: scaleway only)
    - SCW_DEFAULT_ORGANIZATION_ID / _PROJECT_ID
    - INFISICAL_MACHINE_IDENTITY_ID            (for the minted INFISICAL_AUTH_JWT)

inputs:
  root:
    description: Path to the Terraform root (passed to -chdir).
    required: true
  tfvars-file:
    description: >
      Filename of the .tfvars under env/ (e.g. 10-cluster-scaleway-dev.tfvars).
      Workspace name is derived by stripping the .tfvars extension.
    required: true
  command:
    description: >
      Terraform command to run: plan | apply | destroy | hard-destroy.
      hard-destroy strips every helm_release/kubernetes_* resource (plus the
      velero-namespace finalizer workaround) from state before destroying,
      so the only thing left for `terraform destroy` to actually do is
      delete the underlying cluster -- skips all graceful in-cluster
      teardown, only safe for a disposable cluster where
      delete_additional_resources = true already covers cleanup of what the
      workloads provisioned outside Terraform (e.g. LoadBalancers).
    required: false
    default: plan
  state-backend:
    description: >
      Where this root's remote state lives: "aws" (assume aws-role-arn via OIDC)
      or "scaleway" (reuse SCW_ACCESS_KEY/SCW_SECRET_KEY from the job env as the
      backend's AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY, no role assumed). See
      the top-of-file description for which mode fits which root.
    required: false
    default: aws
  aws-role-arn:
    description: >
      ARN of the IAM role to assume via OIDC (Terraform-state R/W). Required
      when state-backend is "aws"; ignored when "scaleway".
    required: false
  aws-region:
    description: AWS region for the assumed role.
    required: false
    default: eu-west-3
  infisical-oidc-audience:
    description: >
      OIDC audience for the Infisical machine identity. When set (the default),
      mint a GitHub OIDC JWT into INFISICAL_AUTH_JWT. Set to "" to skip it for
      roots that don't read Infisical.
    required: false
    default: https://github.com/IntegratedDynamic

runs:
  using: composite
  steps:
    - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
      with:
        # Keep in sync with mise.toml [tools] terraform version.
        terraform_version: "1.14"

    # Keyless Infisical auth: mint a GitHub OIDC JWT into INFISICAL_AUTH_JWT (the
    # provider's default token env var). The audience must match the identity's
    # boundAudiences. getIDToken masks the value automatically.
    - name: Mint Infisical OIDC token
      if: inputs.infisical-oidc-audience != ''
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        AUDIENCE: ${{ inputs.infisical-oidc-audience }}
      with:
        script: |
          const jwt = await core.getIDToken(process.env.AUDIENCE)
          core.exportVariable('INFISICAL_AUTH_JWT', jwt)

    - name: Validate state-backend inputs
      if: inputs.state-backend == 'aws' && inputs.aws-role-arn == ''
      shell: bash
      run: |
        echo "::error::state-backend is 'aws' but aws-role-arn was not provided."
        exit 1

    - name: Assume AWS role via OIDC
      if: inputs.state-backend == 'aws'
      uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
      with:
        role-to-assume: ${{ inputs.aws-role-arn }}
        aws-region: ${{ inputs.aws-region }}

    # Split from the actual plan/apply/destroy step below so GitHub's own
    # per-step timing shows how long the command itself took, separate from
    # init/workspace-select -- a single combined step only ever showed their
    # sum. AWS_ACCESS_KEY_ID/_SECRET_ACCESS_KEY (state-backend: scaleway
    # only) are written to $GITHUB_ENV, not just exported locally, so they
    # carry over to the next step -- each composite-action step is its own
    # shell invocation.
    - name: Terraform init
      shell: bash
      env:
        ROOT: ${{ inputs.root }}
        TFVARS: ${{ inputs.tfvars-file }}
        COMMAND: ${{ inputs.command }}
        STATE_BACKEND: ${{ inputs.state-backend }}
        # SCW_* and INFISICAL_MACHINE_IDENTITY_ID are inherited from the job env.
      run: |
        set -euo pipefail
        # Terraform's s3 backend only ever reads these two literal env var names,
        # regardless of which S3-compatible endpoint the backend block points at
        # (see 00-foundation/scaleway/README.md's "Cross-root reads need no
        # manual credential setup" section for why a backend block can't just
        # read a data source or variable instead).
        if [ "$STATE_BACKEND" = "scaleway" ]; then
          echo "AWS_ACCESS_KEY_ID=$SCALEWAY_STATE_ACCESS_KEY" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$SCALEWAY_STATE_SECRET_KEY" >> "$GITHUB_ENV"
          export AWS_ACCESS_KEY_ID="$SCALEWAY_STATE_ACCESS_KEY"
          export AWS_SECRET_ACCESS_KEY="$SCALEWAY_STATE_SECRET_KEY"
        fi
        ws="${TFVARS%.tfvars}"
        terraform -chdir="$ROOT" init -input=false
        # apply may target a brand-new env whose workspace doesn't exist yet;
        # read paths (plan/destroy) select an existing one.
        if [ "$COMMAND" = "apply" ]; then
          terraform -chdir="$ROOT" workspace select -or-create "$ws"
        else
          terraform -chdir="$ROOT" workspace select "$ws"
        fi

    # hard-destroy only: drop every resource whose deletion normally goes
    # through the Kubernetes API from state *before* destroy runs, so
    # `terraform destroy` only has the cloud-provider resources left to
    # actually delete (deleting the cluster itself takes everything inside
    # it with it -- 100x faster than a graceful Helm-uninstall-by-
    # Helm-uninstall teardown). `state rm` only touches Terraform's
    # bookkeeping, never the live resources -- nothing here calls the
    # Kubernetes API. Confirmed live 2026-08-25: delete_additional_resources
    # = true on scaleway_k8s_cluster.this already covers the LoadBalancer
    # envoy-gateway's Gateway resource creates outside Terraform, so nothing
    # gets orphaned by skipping the graceful path.
    - name: Strip in-cluster resources from state (hard-destroy)
      if: inputs.command == 'hard-destroy'
      shell: bash
      env:
        ROOT: ${{ inputs.root }}
      run: |
        set -euo pipefail
        addrs=$(terraform -chdir="$ROOT" state list | awk -F. '
          { n = NF; type = $(n-1); name = $n
            if (type == "helm_release" || type ~ /^kubernetes_/ \
                || (type == "null_resource" && name == "velero_namespace_predelete_cleanup")) print }
        ')
        if [ -z "$addrs" ]; then
          echo "Nothing to strip -- already gone or never created."
        else
          echo "$addrs"
          echo "$addrs" | xargs terraform -chdir="$ROOT" state rm
        fi

    - name: Terraform ${{ inputs.command }}
      shell: bash
      env:
        ROOT: ${{ inputs.root }}
        TFVARS: ${{ inputs.tfvars-file }}
        COMMAND: ${{ inputs.command }}
        # AWS_ACCESS_KEY_ID/_SECRET_ACCESS_KEY (state-backend: scaleway) or
        # the assumed role's creds (state-backend: aws) are already in the
        # job env by this point -- see the previous step.
      run: |
        set -euo pipefail
        case "$COMMAND" in
          plan)                 terraform -chdir="$ROOT" plan    -input=false -var-file="env/${TFVARS}" ;;
          apply)                terraform -chdir="$ROOT" apply   -input=false -auto-approve -var-file="env/${TFVARS}" ;;
          destroy|hard-destroy) terraform -chdir="$ROOT" destroy -input=false -auto-approve -var-file="env/${TFVARS}" ;;
          *) echo "::error::unknown command '$COMMAND' (expected plan|apply|destroy|hard-destroy)"; exit 1 ;;
        esac

    # Confirmed live (2026-08-26, three separate times in one session): this
    # job's own timeout-minutes ceiling, or a manual `gh run cancel`, kills
    # the runner mid-apply/destroy before Terraform's own S3 native lock
    # (use_lockfile) gets released -- every subsequent run then fails
    # immediately on "Error acquiring the state lock" until an admin
    # manually runs `terraform force-unlock`. GitHub Actions still runs
    # `if: failure() || cancelled()` steps after a job-timeout cancellation
    # (the documented mechanism this relies on) or an ordinary step failure,
    # so this only pays for an extra lock-probing `terraform plan` on the
    # unhappy path -- a normal green run never runs this step at all.
    #
    # Safe to force-unlock unconditionally: this workflow's own concurrency
    # group (scaleway-${{ github.ref }}, cancel-in-progress: false)
    # guarantees only one run ever touches this root's state at a time, so
    # any lock still held by the time THIS job's steps finish can only be
    # THIS SAME job's own -- never a genuinely concurrent operation's.
    - name: Release orphaned state lock (cleanup)
      if: failure() || cancelled()
      shell: bash
      env:
        ROOT: ${{ inputs.root }}
        TFVARS: ${{ inputs.tfvars-file }}
      run: |
        set -uo pipefail
        # -refresh=false: this only needs to attempt lock ACQUISITION, not
        # produce a real plan -- the cluster itself may be mid-destroy or
        # unreachable, and contacting every provider would defeat the point
        # of a fast, reliable cleanup step. -lock-timeout=5s: fail fast if
        # genuinely (and correctly) locked by a truly concurrent run, rather
        # than hanging on the default wait.
        log=$(mktemp)
        if terraform -chdir="$ROOT" plan -input=false -refresh=false -lock-timeout=5s -var-file="env/${TFVARS}" >"$log" 2>&1; then
          echo "State is not locked -- nothing to clean up."
          exit 0
        fi
        lock_id=$(grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' "$log" | head -1)
        if [ -z "$lock_id" ]; then
          echo "Plan failed for a reason other than a state lock -- leaving state alone:"
          cat "$log"
          exit 0
        fi
        echo "Found an orphaned lock ($lock_id, left by this same run) -- releasing it."
        terraform -chdir="$ROOT" force-unlock -force "$lock_id"
