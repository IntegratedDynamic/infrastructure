
name: OpenTofu — Scaleway ephemeral cluster

run-name: "OpenTofu ${{ (github.event.action == 'closed' || github.event.action == 'unlabeled') && 'hard-destroy' || 'apply' }} — ephemeral cluster pr-${{ github.event.pull_request.number }} @ ${{ github.event.pull_request.head.ref }}"

# Companion to scaleway.yml's manual workflow_dispatch path (iteration 1,
# unchanged, still the proven route for main's own 10-cluster-scaleway-dev
# workspace). This is iteration 2: a PR on THIS repo, carrying the
# `ephemeral-cluster` label, gets its own full copy of the homelab cluster in
# its own OpenTofu workspace (pr-<number>) and its own real subdomain
# (pr-<number>.scalepack.fr, see 10-cluster/scaleway/variables.tf's
# base_domain) -- so it never contends with main's live cluster over DNS
# records, the LB, or the wildcard TLS cert. Opt-in via the label (not every
# PR -- a Kapsule cluster + node pool + LB is real money, see this repo's own
# CLAUDE.md "Live-cluster testing discipline"): apply on
# opened/synchronize/reopened/labeled while the label is present,
# hard-destroy on closed or on the label being removed.
#
# hard-destroy (not a graceful destroy) on cleanup: this cluster never holds
# anything worth a graceful in-cluster teardown -- same rationale
# scaleway.yml's own `command` input already documents for the disposable
# homelab cluster in general.
#
# No new state bucket, no new IAM identity: the tfvars-generation step below
# only ever points at the SAME bucket/state-backend identity
# scaleway.yml uses (id-terraform-state-10-cluster-scaleway) -- a fresh
# OpenTofu workspace is just a new key under that same bucket, and the
# cross-root credential reads (backup/openbao-unseal/dns state) are shared,
# unmodified, read-only lookups every workspace can use identically.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, closed]

concurrency:
  # Per-PR, not per-ref: synchronize (new commits) and labeled/unlabeled
  # events on the same PR must serialize against each other and against the
  # eventual close/destroy -- never cancel mid-flight (same reasoning as
  # scaleway.yml's own group).
  group: scaleway-ephemeral-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  terraform:
    # unlabeled's own payload already reflects the label's REMOVAL -- it's
    # gone from pull_request.labels by the time this evaluates, so the
    # `contains` check alone would never fire the destroy this event is
    # meant to trigger. github.event.label is the one exception: on a
    # labeled/unlabeled event it's always the specific label that just
    # changed, so this second clause catches exactly "ephemeral-cluster was
    # the one just removed" without matching on some unrelated label change.
    if: >-
      contains(github.event.pull_request.labels.*.name, 'ephemeral-cluster') ||
      (github.event.action == 'unlabeled' && github.event.label.name == 'ephemeral-cluster')
    runs-on: ubuntu-latest
    # Same as scaleway.yml -- identical platform, identical from-scratch
    # convergence time.
    timeout-minutes: 45
    # Same GitHub environment as scaleway.yml -- reuses the same
    # SCW_*/SCALEWAY_STATE_* secrets, no new identity needed per ephemeral
    # workspace.
    environment: scaleway
    permissions:
      contents: read
    env:
      SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      SCALEWAY_STATE_ACCESS_KEY: ${{ secrets.SCALEWAY_STATE_ACCESS_KEY }}
      SCALEWAY_STATE_SECRET_KEY: ${{ secrets.SCALEWAY_STATE_SECRET_KEY }}
      SCW_DEFAULT_ORGANIZATION_ID: ${{ vars.SCW_DEFAULT_ORGANIZATION_ID }}
      SCW_DEFAULT_PROJECT_ID: ${{ vars.SCW_DEFAULT_PROJECT_ID }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      # Real state key/workspace, not a throwaway name -- env/*.tfvars'
      # filename (minus .tfvars) IS the OpenTofu workspace name, same
      # convention this repo's CLAUDE.md documents for every other root.
      # Generated fresh every run (never committed): the three appended keys
      # don't exist in the dev tfvars today, so appending is safe -- no
      # duplicate-key error.
      - name: Generate ephemeral tfvars
        id: vars
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          slug="pr-${PR_NUMBER}"
          tfvars="10-cluster-scaleway-${slug}.tfvars"
          cp "10-cluster/scaleway/env/10-cluster-scaleway-dev.tfvars" "10-cluster/scaleway/env/${tfvars}"
          {
            echo ""
            echo "# Generated by .github/workflows/scaleway-ephemeral.yml -- never committed."
            echo "cluster_name   = \"${slug}\""
            echo "infra_revision = \"${HEAD_REF}\""
            echo "base_domain    = \"${slug}.scalepack.fr\""
          } >> "10-cluster/scaleway/env/${tfvars}"
          echo "tfvars=${tfvars}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event.action }}" = "closed" ] || [ "${{ github.event.action }}" = "unlabeled" ]; then
            echo "command=hard-destroy" >> "$GITHUB_OUTPUT"
          else
            echo "command=apply" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/terraform
        with:
          root: 10-cluster/scaleway
          tfvars-file: ${{ steps.vars.outputs.tfvars }}
          command: ${{ steps.vars.outputs.command }}
          state-backend: scaleway
          infisical-oidc-audience: '' # this root doesn't consume Infisical
