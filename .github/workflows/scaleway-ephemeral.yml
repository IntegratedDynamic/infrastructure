name: OpenTofu — Scaleway ephemeral cluster

run-name: "OpenTofu ${{ (github.event.action == 'closed' || github.event.action == 'unlabeled') && 'hard-destroy' || 'apply' }} — Ephemeral Cluster pr-${{ github.event.pull_request.number }} @ ${{ github.event.pull_request.head.ref }}"

# Companion to scaleway.yml's manual workflow_dispatch path (iteration 1,
# unchanged, still the proven route for main's own 10-cluster-scaleway-staging
# state). This is iteration 2: a PR on THIS repo, carrying the
# `ephemeral-cluster` label, gets its own full copy of the homelab cluster in
# its own state (instance pr-<number>) and a "-pr-<number>" suffix
# on every platform hostname (see 10-cluster/scaleway/variables.tf's
# env_suffix) -- so it never contends with main's live cluster over DNS
# records, the LB, or the wildcard TLS cert. Opt-in via the label (not every
# PR -- a Kapsule cluster + node pool + LB is real money, see this repo's own
# CLAUDE.md "Live-cluster testing discipline"): apply on
# opened/synchronize/reopened/labeled while the label is present,
# hard-destroy on closed or on the label being removed.
#
# hard-destroy (not a graceful destroy) on cleanup: this cluster never holds
# anything worth a graceful in-cluster teardown -- same rationale
# scaleway.yml's own `command` input already documents for the disposable
# homelab cluster in general.
#
# No new state bucket, no new IAM identity: the Terragrunt unit only ever points
# at the SAME bucket/state-backend identity scaleway.yml uses
# (id-terraform-state-10-cluster-scaleway) -- a fresh state is just a new key
# under that same bucket, and the cross-root credential reads
# (backup/openbao-unseal/dns state) are shared, unmodified, read-only
# lookups every environment can use identically.
#
# One job (it used to be two): a generate-tfvars job built a per-PR copy of the
# staging tfvars with `cp` + `sed` and uploaded it as an artifact. That is gone:
# live/clusters/ephemeral (cluster.hcl + terragrunt.hcl) takes the main recipe and the core's
# wiring as its base and puts the per-PR overrides (cluster_name, env_suffix, Let's Encrypt
# staging, infra_revision = the PR's head ref, ...) on the command line, from the
# two variables below. The inputs are the committed unit plus those two values,
# both visible in the run.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, closed]

concurrency:
  # Per-PR, not per-ref: synchronize (new commits) and labeled/unlabeled
  # events on the same PR must serialize against each other and against the
  # eventual close/destroy -- never cancel mid-flight (same reasoning as
  # scaleway.yml's own group).
  group: scaleway-ephemeral-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read

# Config, not secrets -- which Terragrunt unit this workflow derives every
# ephemeral cluster from (live/<unit>: environment "ephemeral", root
# 10-cluster/scaleway). Plain workflow-level env for now (available as both
# ${{ env.* }} in `with:` fields and a real shell var in `run:` steps); promote
# to real repo/org `vars.*` later if more than this one workflow ever needs to
# agree on it.
env:
  TG_UNIT: clusters/ephemeral/10-cluster/scaleway

jobs:
  terraform:
    # unlabeled's own payload already reflects the label's REMOVAL -- it's
    # gone from pull_request.labels by the time this evaluates, so the
    # `contains` check alone would never fire the destroy this event is
    # meant to trigger. github.event.label is the one exception: on a
    # labeled/unlabeled event it's always the specific label that just
    # changed, so this second clause catches exactly "ephemeral-cluster was
    # the one just removed" without matching on some unrelated label change.
    if: >-
      contains(github.event.pull_request.labels.*.name, 'ephemeral-cluster') ||
      (github.event.action == 'unlabeled' && github.event.label.name == 'ephemeral-cluster')
    runs-on: ubuntu-latest
    # Same as scaleway.yml -- identical platform, identical from-scratch
    # convergence time.
    timeout-minutes: 45
    # Same GitHub environment as scaleway.yml -- reuses the same
    # SCW_*/SCALEWAY_STATE_* secrets, no new identity needed per ephemeral
    # environment.
    environment: scaleway
    permissions:
      contents: read
    env:
      SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      SCALEWAY_STATE_ACCESS_KEY: ${{ secrets.SCALEWAY_STATE_ACCESS_KEY }}
      SCALEWAY_STATE_SECRET_KEY: ${{ secrets.SCALEWAY_STATE_SECRET_KEY }}
      SCW_DEFAULT_ORGANIZATION_ID: ${{ vars.SCW_DEFAULT_ORGANIZATION_ID }}
      SCW_DEFAULT_PROJECT_ID: ${{ vars.SCW_DEFAULT_PROJECT_ID }}
      # Read by live/clusters/ephemeral through get_env(): the state key
      # (10-cluster/scaleway/pr-<PR_NUMBER>/), cluster_name/env_suffix, and the
      # PR's own head ref as infra_revision. HEAD_REF is a branch name chosen by
      # the PR author: it only ever reaches OpenTofu as one `-var` argument
      # (Terragrunt execs it directly, no shell), never as shell text.
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: ./.github/actions/terraform
        with:
          unit: ${{ env.TG_UNIT }}
          command: ${{ (github.event.action == 'closed' || github.event.action == 'unlabeled') && 'hard-destroy' || 'apply' }}
          state-backend: scaleway
          infisical-oidc-audience: '' # this root doesn't consume Infisical

      # No login is surfaced here any more: this used to print Dex's static
      # "ephemeral" password (GitHub's OAuth App cannot register one callback per
      # PR cluster, so Dex bypassed the real connector). Dex is gone (infra issue
      # #135); how an ephemeral cluster authenticates now is an open decision --
      # see that issue.
