
name: OpenTofu — Scaleway cluster

# Makes the run list self-explanatory (default would be the workflow name
# for every run, indistinguishable at a glance) while staying close to the
# original human-readable title -- just the command inserted, and the
# GitHub environment the secrets/permissions actually come from (the
# `environment` input below, fed straight into the job's own `environment:`
# -- one literal, not duplicated). Also the branch dispatched against --
# this workflow gets tested on feature branches all the time, and the
# checkout step only ever surfaces a commit hash, not a branch name; only
# the run list's own branch column shows it otherwise, easy to miss once
# you're inside a run looking at its logs.
run-name: "OpenTofu ${{ inputs.command || 'scheduled up/down' }} — Scaleway cluster (env: ${{ inputs.environment || 'scaleway' }}) @ ${{ github.ref_name }}"

# Drives 10-cluster/scaleway through the .github/actions/terraform composite action.
#
# Iteration 1 (2026-08-25): workflow_dispatch only, mirroring a local
# `tofu plan|apply|destroy` 1:1 (apply = up, destroy = down). This root's
# state backend auth (state-backend: scaleway below) had never actually been
# exercised in CI before this — it was previously wired to assume a real AWS
# IAM role for a bucket that has lived on Scaleway since the 2026-08-19 state
# migration, which 403s (see 00-foundation/scaleway/README.md's "Known
# follow-up"). pull_request(plan)/push(apply) triggers are still deliberately
# not wired in. The office-hours schedule (see below) now automates up/down
# once the manual apply/hard-destroy cycle was proven.
#
# Scaleway cluster lifecycle uses the CI API key from the dispatched-to
# GitHub environment (`scaleway` by default -- Kubernetes/VPC/PrivateNetwork/
# Instances FullAccess, see 01-iam/bootstrap/scaleway).
# State backend auth (state-backend: scaleway) uses a DIFFERENT key pair --
# SCALEWAY_STATE_ACCESS_KEY/_SECRET_KEY, the state bucket's own dedicated
# identity (00-foundation/scaleway's per-bucket identities), fed to GitHub via
# OpenBao+ESO. The general CI identity above can't do this job: it can
# read/write state objects but was never granted delete, so it creates the S3
# native lock fine but can't release it (confirmed live 2026-08-25). Provider
# creds are set as job env (read by the action) -- never passed as plain
# action inputs.

# Office-hours schedule (2026-11-04): UP 11:00-18:00 Europe/Paris in winter
# (cron 10:05 UTC apply, 17:05 UTC hard-destroy); `github.event.schedule`
# tells the two apart. GitHub cron is UTC-only, so in summer time (CEST) the
# window shifts to 12:00-19:00 -- shift both crons by -1h at the DST change
# if that matters. A cold `apply` takes 15-45 min. Out of hours, dispatch
# manually (apply = up, hard-destroy = down).

on:
  schedule:
    - cron: '5 10 * * *'  # up
    - cron: '5 17 * * *'  # down
  workflow_dispatch:
    inputs:
      command:
        description: >
          OpenTofu command (apply = up, destroy = down, hard-destroy = fast
          down -- strips helm_release/kubernetes_* from state first, so
          destroy only has the Scaleway cluster left to delete; skips
          graceful in-cluster teardown, fine for this disposable cluster).
        type: choice
        options: [plan, apply, destroy, hard-destroy]
        default: plan
      environment:
        description: >
          GitHub environment to run against -- gates which secrets/protection
          rules apply (job's environment: below). A free-text string, not a
          dropdown: this only ever targets 10-cluster/scaleway today, but
          future environments (more clusters, ephemeral ones) won't all be
          enumerable ahead of time.
        type: string
        default: scaleway

concurrency:
  # Serialize everything that writes this root's state (apply/destroy never
  # cancel mid-flight) -- guards against two manual dispatches racing.
  group: scaleway-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# Config, not secrets -- which root/workspace this workflow drives. Plain
# workflow-level env for now (available as both ${{ env.* }} in `with:`
# blocks and a real shell var in `run:` steps); promote to real repo/org
# `vars.*` later if more than this one workflow ever needs to agree on
# them.
env:
  TF_ROOT: 10-cluster/scaleway
  TFVARS_FILE: 10-cluster-scaleway-staging.tfvars

jobs:
  terraform:
    # Pause switch for the office-hours schedule: set the repo variable
    # SCALEWAY_CLUSTER_SCHEDULE_ENABLED to 'false' to skip scheduled runs
    # (unset or any other value = enabled). Manual dispatches are never
    # affected. A pause freezes the cluster as-is (skipping the 18:00 down
    # leaves it running).
    if: github.event_name != 'schedule' || vars.SCALEWAY_CLUSTER_SCHEDULE_ENABLED != 'false'
    runs-on: ubuntu-latest
    # A from-scratch apply legitimately needs more than the 20m this started
    # at -- confirmed live 2026-08-25: module.wait_networking_healthy alone
    # took 11m30s. cert-manager's own Application (networking-apps wave 0)
    # was actually Synced+Healthy within 2 minutes (one retry) -- the real
    # gap was the networking-apps wrapper itself taking 6+ more minutes to
    # notice that and let wave 1 (gateway-config/external-dns) start,
    # despite dozens of its own reconcile passes in between. Best working
    # theory: the argocd-application-controller's own queue backlog under
    # the initial full-tree burst (~30 Applications at once) -- it's CPU-
    # limited to 3 cores with no controller.status/operation.processors
    # tuning, and this repo already hit an analogous OOM on the same burst
    # before (see argocd.tf's GOMEMLIMIT comment) -- not proven, no CPU
    # metrics captured for that exact window. 45m gives real margin without
    # masking a genuine hang either way; revisit with more data, or use
    # hard-destroy below to iterate faster while investigating.
    timeout-minutes: 45
    # Fed by the environment input above -- carries SCW_ACCESS_KEY /
    # SCW_SECRET_KEY (and satisfies zizmor's secrets-in-environment audit).
    environment: ${{ inputs.environment || 'scaleway' }}
    permissions:
      contents: read
    # Provider creds exposed to the composite action via the job env (not inputs).
    env:
      SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      # State bucket's own dedicated identity (not the general CI identity
      # above) -- see action.yml's header comment for why. Fed to GitHub via
      # OpenBao+ESO, not gh secret set.
      SCALEWAY_STATE_ACCESS_KEY: ${{ secrets.SCALEWAY_STATE_ACCESS_KEY }}
      SCALEWAY_STATE_SECRET_KEY: ${{ secrets.SCALEWAY_STATE_SECRET_KEY }}
      SCW_DEFAULT_ORGANIZATION_ID: ${{ vars.SCW_DEFAULT_ORGANIZATION_ID }}
      SCW_DEFAULT_PROJECT_ID: ${{ vars.SCW_DEFAULT_PROJECT_ID }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: ./.github/actions/terraform
        with:
          root: ${{ env.TF_ROOT }}
          tfvars-file: ${{ env.TFVARS_FILE }}
          # The cron literal below MUST match the 'up' cron in on.schedule (no
          # way to reference it from an expression); a mismatch makes the up
          # run fall through to hard-destroy.
          command: ${{ github.event_name == 'schedule' && (github.event.schedule == '5 10 * * *' && 'apply' || 'hard-destroy') || inputs.command }}
          state-backend: scaleway
          infisical-oidc-audience: '' # this root doesn't consume Infisical
